services:
  - type: web
    name: wxcc-analytics-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wxcc-analytics-db
          property: connectionString
      - key: WXCC_BASE_URL
        value: https://api.wxcc-us1.cisco.com
      - key: WXCC_ACCESS_TOKEN
        sync: false
      - key: WXCC_CLIENT_ID
        sync: false
      - key: WXCC_CLIENT_SECRET
        sync: false
      - key: WXCC_REFRESH_TOKEN
        sync: false
      - key: WXCC_TOKEN_URL
        value: https://webexapis.com/v1/access_token

  - type: cron
    name: wxcc-analytics-collector
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.app.jobs.collect_recent
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wxcc-analytics-db
          property: connectionString
      - key: WXCC_BASE_URL
        value: https://api.wxcc-us1.cisco.com
      - key: WXCC_ACCESS_TOKEN
        sync: false
      - key: WXCC_CLIENT_ID
        sync: false
      - key: WXCC_CLIENT_SECRET
        sync: false
      - key: WXCC_REFRESH_TOKEN
        sync: false
      - key: WXCC_TOKEN_URL
        value: https://webexapis.com/v1/access_token

  - type: cron
    name: wxcc-analytics-reconcile
    runtime: python
    schedule: "15 6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.app.jobs.reconcile_previous_day
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wxcc-analytics-db
          property: connectionString
      - key: WXCC_BASE_URL
        value: https://api.wxcc-us1.cisco.com
      - key: WXCC_ACCESS_TOKEN
        sync: false
      - key: WXCC_CLIENT_ID
        sync: false
      - key: WXCC_CLIENT_SECRET
        sync: false
      - key: WXCC_REFRESH_TOKEN
        sync: false
      - key: WXCC_TOKEN_URL
        value: https://webexapis.com/v1/access_token

databases:
  - name: wxcc-analytics-db
    plan: basic-256mb
