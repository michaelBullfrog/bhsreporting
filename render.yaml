services:
  - type: web
    name: wxcc-analytics-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wxcc-analytics-db
          property: connectionString
      - key: WXCC_BASE_URL
        value: https://api.wxcc-us1.cisco.com
      - key: WXCC_ACCESS_TOKEN
        sync: false
      - key: WXCC_CLIENT_ID
        sync: false
      - key: WXCC_CLIENT_SECRET
        sync: false
      - key: WXCC_REFRESH_TOKEN
        sync: false
      - key: WXCC_TOKEN_URL
        value: https://webexapis.com/v1/access_token
      - key: WEBEX_AUTH_REDIRECT_URI
        value: https://bhsreporting.bullfrog.net/auth/webex/callback

  - type: cron
    name: wxcc-analytics-collector
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.app.jobs.collect_recent
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wxcc-analytics-db
          property: connectionString
      - key: WXCC_BASE_URL
        value: https://api.wxcc-us1.cisco.com
      - key: WXCC_ACCESS_TOKEN
        sync: false
      - key: WXCC_CLIENT_ID
        sync: false
      - key: WXCC_CLIENT_SECRET
        sync: false
      - key: WXCC_REFRESH_TOKEN
        sync: false
      - key: WXCC_TOKEN_URL
        value: https://webexapis.com/v1/access_token

  - type: cron
    name: wxcc-analytics-reconcile
    runtime: python
    schedule: "15 6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.app.jobs.reconcile_previous_day
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wxcc-analytics-db
          property: connectionString
      - key: WXCC_BASE_URL
        value: https://api.wxcc-us1.cisco.com
      - key: WXCC_ACCESS_TOKEN
        sync: false
      - key: WXCC_CLIENT_ID
        sync: false
      - key: WXCC_CLIENT_SECRET
        sync: false
      - key: WXCC_REFRESH_TOKEN
        sync: false
      - key: WXCC_TOKEN_URL
        value: https://webexapis.com/v1/access_token

  - type: cron
    name: wxcc-analytics-voicemail
    runtime: python
    schedule: "0 */2 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.app.jobs.collect_voicemail_recent
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wxcc-analytics-db
          property: connectionString
      - key: WEBEX_CALLING_CDR_BASE_URL
        value: https://analytics-calling.webexapis.com
      - key: WEBEX_CALLING_ACCESS_TOKEN
        sync: false
      - key: WEBEX_CALLING_CLIENT_ID
        sync: false
      - key: WEBEX_CALLING_CLIENT_SECRET
        sync: false
      - key: WEBEX_CALLING_REFRESH_TOKEN
        sync: false
      - key: WEBEX_CALLING_TOKEN_URL
        value: https://webexapis.com/v1/access_token
      - key: WEBEX_CALLING_COLLECTOR_LOOKBACK_MINUTES
        value: "150"
      - key: SERVICE_VM_GROUP_UUID
        value: 2c655ada-1784-4002-9266-2f2f66839967
      - key: SERVICE_VM_GROUP_NAME
        value: Service After Hours Vmail
      - key: SERVICE_VM_EXTENSION
        value: "6005"

databases:
  - name: wxcc-analytics-db
    plan: basic-256mb
